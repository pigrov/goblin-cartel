name: deploy

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

env:
  DEPLOY_DOMAIN: goblin-cartel.murph.ru
  DEPLOY_PATH: /srv/goblin-cartel

jobs:
  quality-gate:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable pnpm
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: UTF-8 check
        run: pnpm encoding:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Drizzle migration check
        run: pnpm --filter @goblin-cartel/backend db:check

      - name: Build
        run: pnpm build

  deploy:
    runs-on: ubuntu-latest
    needs: quality-gate

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create release archive
        run: |
          tar \
            --exclude=.git \
            --exclude=node_modules \
            --exclude=.env \
            --exclude=.env.production \
            --exclude=release.tar.gz \
            --exclude='*/node_modules' \
            --exclude='*/dist' \
            -czf release.tar.gz .

      - name: Upload release
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: release.tar.gz
          target: /srv/goblin-cartel

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd /srv/goblin-cartel

            if [ ! -s .env.production ]; then
              echo "/srv/goblin-cartel/.env.production is missing"
              exit 1
            fi

            rm -rf current
            mkdir -p current
            tar -xzf release.tar.gz -C current
            cp .env.production current/.env.production

            cd current
            docker compose --env-file .env.production -f deploy/docker-compose.prod.yml up -d --build

            cp deploy/nginx-goblin-cartel.https.conf /srv/transcribe-infra/nginx/conf.d/goblin-cartel.murph.ru.conf
            docker exec transcribe_nginx nginx -t
            docker exec transcribe_nginx nginx -s reload

            docker compose --env-file .env.production -f deploy/docker-compose.prod.yml ps

      - name: Health check
        run: |
          curl --fail --retry 12 --retry-delay 5 "https://$DEPLOY_DOMAIN/api/health"
