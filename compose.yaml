services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: goblin_cartel
      POSTGRES_USER: goblin_cartel
      POSTGRES_PASSWORD: goblin_cartel
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goblin_cartel -d goblin_cartel"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - goblin_cartel_pg:/var/lib/postgresql/data

volumes:
  goblin_cartel_pg:
